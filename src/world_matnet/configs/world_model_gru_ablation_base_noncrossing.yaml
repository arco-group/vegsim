model_type: vegetation_world_model
dynamics_type: gru

# data
cache_root: Data/cache/train_avg_NDVI_clear_sky
train_split: 0.8
apply_scaling: true
feature_engineering: true
min_crop_pixels: 60.0
quantiles: [0.1, 0.5, 0.9]

# run/output
checkpoint_root: checkpoints/ablations_gru_pinball_non_crossing
experiment_name: wm_gru_ab01_ref
seed: 42

# shared backbone
d_model: 128
num_layers: 4
num_heads: 4
dim_feedforward: 256
dropout: 0.1

# world model core
summarizer_type: attention_pooling
latent_dim: 128
sample_initial_state: true
initial_state_kl_weight: 0.0

# horizon/future
use_horizon_embedding: true
horizon_emb_dim: 32
horizon_embedding_type: learned
max_horizon: 512

# spatial metadata
spatial_enabled: false
spatial_cont_dim: 2
spatial_cat_cardinalities: [128]
spatial_emb_dim: 32
use_harmonic_coords: false
num_harmonic_frequencies: 4
spatial_dropout: 0.1

# gru dynamics
dynamics_hidden_dim: 128
dynamics_num_layers: 2
use_residual_update: false
sample_latent: true

# decoder
decoder_hidden_dim: 128
decoder_num_layers: 2
use_horizon_conditioned_decoder: false
enforce_quantile_ordering: false

# optional heads/losses
use_risk_head: false
risk_threshold: 0.2
risk_loss_weight: 0.0
smoothness_loss_weight: 0.0
smoothness_loss_type: huber
aux_loss_weight: 0.0
aux_loss_type: mae
use_aux_decoder: false
noncrossing_loss_weight: 0.01
sigreg_weight: 0.0
sigreg_num_proj: 256
sigreg_knots: 17
use_sigreg_projector: false
sigreg_projector_hidden_dim: 128
sigreg_projector_output_dim: 128
sigreg_projector_num_layers: 1
sigreg_projector_dropout: 0.0
compute_calibration_metrics: true

# optimization
epochs: 200
batch_size: 128
lr: 1.0e-4
lr_reduce_on_plateau: true
lr_factor: 0.2
lr_patience: 20
lr_min: 5.0e-5
time_weight_alpha: 0.1

# trainer/runtime
accelerator: auto
devices: auto
precision: "32"
num_workers: 4
pin_memory: true

# logging
logger_type: wandb
wandb_project: vegsim
wandb_job_type: train
wandb_offline: false
