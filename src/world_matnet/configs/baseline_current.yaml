model_type: baseline_forecaster
cache_root: Data/cache/train_avg_NDVI_clear_sky
train_split: 0.8
apply_scaling: true
feature_engineering: true
quantiles: [0.1, 0.5, 0.9]

# baseline architecture
d_model: 128
num_layers: 8
num_heads: 8
dim_feedforward: 512
dropout: 0.1

# optimization
epochs: 200
batch_size: 128
lr: 1.0e-4
lr_reduce_on_plateau: true
lr_factor: 0.2
lr_patience: 20
lr_min: 5.0e-5

# baseline loss/time weighting
time_weight_alpha: 0.1

# ablations
ablate_future_covariates: false
ablate_history_covariates: false
ablate_target_history: false

# trainer
accelerator: auto
devices: auto
precision: "32"
